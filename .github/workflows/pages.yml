name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Baixar motor OrcaWasm (release pinada) e conferir SHA-256
        run: |
          set -euo pipefail
          source engine.lock
          curl -fsSL -o site/slicer-mt.js   "$BASE_URL/slicer-mt.js"
          curl -fsSL -o site/slicer-mt.wasm "$BASE_URL/slicer-mt.wasm"
          echo "$SHA256_JS  site/slicer-mt.js"   | sha256sum -c -
          echo "$SHA256_WASM  site/slicer-mt.wasm" | sha256sum -c -
          ls -la site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
